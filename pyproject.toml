[project]
name = "pytorch-basics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torcheval>=0.0.7",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
]

[project.scripts]
pytorch-basics = "pytorch_basics:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
